<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WanderHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../cssFile/globalStyles.css">
</head>
<body class="font-poppins bg-gradient-to-br from-blue-50 via-blue-100 to-teal-50 min-h-screen flex items-center justify-center">
    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="../index.html" class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-teal-600 bg-clip-text text-transparent">
                    🌍 WanderHub
                </a>
                <div class="hidden md:flex gap-2">
                    <a href="../index.html" class="px-4 py-2 text-gray-700 hover:text-blue-600 transition">Home</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="w-full max-w-md px-4 mt-16 md:mt-0">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h1 class="text-4xl font-bold text-center bg-gradient-to-r from-blue-600 to-teal-600 bg-clip-text text-transparent mb-2">Welcome Back</h1>
            <p class="text-center text-gray-600 mb-8">Sign in to your WanderHub account</p>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-gray-800 font-semibold mb-2">Email Address</label>
                    <input type="email" id="loginEmail" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-600 focus:outline-none transition" placeholder="your@email.com" required>
                </div>

                <div>
                    <label class="block text-gray-800 font-semibold mb-2">Password</label>
                    <input type="password" id="loginPassword" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-600 focus:outline-none transition" placeholder="••••••••" required>
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" class="w-4 h-4 text-blue-600 rounded">
                        <span class="ml-2 text-gray-600 text-sm">Remember me</span>
                    </label>
                    <a href="#" class="text-blue-600 hover:text-teal-600 text-sm font-semibold">Forgot password?</a>
                </div>

                <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-teal-600 text-white font-bold rounded-lg hover:shadow-lg transform hover:-translate-y-0.5 transition">
                    Sign In
                </button>
            </form>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white text-gray-500">Or continue with</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <button class="py-2 border-2 border-gray-300 rounded-lg text-gray-700 font-semibold hover:border-blue-600 transition">
                    🔵 Google
                </button>
                <button class="py-2 border-2 border-gray-300 rounded-lg text-gray-700 font-semibold hover:border-blue-600 transition">
                    🔷 Facebook
                </button>
            </div>

            <p class="text-center text-gray-600">
                Don't have an account? 
                <a href="signup.html" class="text-blue-600 font-bold hover:text-teal-600">Sign up</a>
            </p>
        </div>
    </div>

    <script src="../jsFile/jsFunctions.js"></script>
</body>
</html>
